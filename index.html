<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Rugged AI</title>
<style>body{font:15px system-ui;background:#0b0d10;color:#eee;max-width:900px;margin:auto;padding:20px}input,select,textarea,button{background:#171c23;color:#fff;border:1px solid #363e4a;border-radius:9px;padding:10px;margin:4px}textarea{width:70%;min-height:50px}.box{background:#14181e;border:1px solid #2a3039;border-radius:14px;padding:16px;margin:12px 0}.m{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.u{background:#283346}.a{background:#1a1f26}.hidden{display:none}</style>
<h1>Rugged AI</h1><p>General is default. NSFW-capable accounts can mix General and Adult-capable messages in the same conversation.</p>
<div id=auth class=box><input id=email placeholder=Email><input id=pass type=password placeholder="Password (8+ chars)"><button onclick=go('/auth/register')>Create account</button><button onclick=go('/auth/login')>Log in</button><div id=msg></div></div>
<div id=app class=hidden><div class=box><input id=api placeholder="API URL"><select id=mode><option>general</option><option>adult</option></select><button onclick=newkey()>Create API key</button></div><div id=chat class=box></div><textarea id=input placeholder="Message..."></textarea><button onclick=send()>Send</button><pre id=keyout></pre></div>
<script>
let T=localStorage.T||'',U=localStorage.U||'',H=[],$=x=>document.querySelector(x),esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;');function A(){return ($('#api').value||location.origin).replace(/\/$/,'')}
async function go(path){let r=await fetch(A()+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#pass').value})}),j=await r.json();if(!r.ok)return $('#msg').textContent=j.detail||'Error';T=j.token;U=j.user_id;localStorage.T=T;localStorage.U=U;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden')}
function add(r,t,m){let d=document.createElement('div');d.className='m '+(r=='user'?'u':'a');d.innerHTML='<b>'+m+'</b><br>'+esc(t);$('#chat').append(d);return d}
async function send(){let t=$('#input').value.trim(),m=$('#mode').value;if(!t)return;$('#input').value='';add('user',t,m);H.push({role:'user',content:t});let r=await fetch(A()+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.K||'')},body:JSON.stringify({user_id:U,content_mode:m,messages:H,stream:false})}),j=await r.json(),o=j.choices?.[0]?.message?.content||j.error?.message||JSON.stringify(j);add('assistant',o,m);H.push({role:'assistant',content:o})}
async function newkey(){let edition=prompt('Edition: standard or nsfw','standard')||'standard',name=prompt('Project name','My chatbot')||'My chatbot',r=await fetch(A()+'/api/keys',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:JSON.stringify({name,edition})}),j=await r.json();if(j.api_key){localStorage.K=j.api_key;$('#keyout').textContent='API KEY (shown once):\n'+j.api_key+'\nEdition: '+j.edition}else $('#keyout').textContent=j.detail||JSON.stringify(j)}
if(T){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden')}
</script>
