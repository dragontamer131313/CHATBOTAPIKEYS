name: Unpack Rugged AI

on:
  push:
    paths:
      - "rugged-ai-chat-platform-publish-ready-fixed.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack Rugged AI
        run: |
          rm -rf backend frontend docker deploy examples
          unzip -o rugged-ai-chat-platform-publish-ready-fixed.zip -d /tmp/rugged
          cp -R /tmp/rugged/. .
          rm -f rugged-ai-chat-platform-publish-ready-fixed.zip

      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore Rugged AI project structure" || exit 0
          git push
